[project]
name = "aws-power-switch-cdk"
version = "0.1.0"
description = "Python CDK construct that deploys the power switch Lambda (app bundled as package data)."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "aws-cdk-lib>=2.277.0,<3",
  "constructs>=10.0.0,<11",
]

[project.optional-dependencies]
# The snapshot is synthesized with this exact CDK version, so a CDK upgrade shows up as a
# deliberate snapshot update rather than a random test failure.
test = [
  "aws-cdk-lib==2.277.0",
  "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_power_switch_cdk"]

# Adds the repo-root app/ (minus tests/ and dev/) to the wheel; see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
