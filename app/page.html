<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power switch</title>
  <!-- The shared theme (app/theme/) is inlined at each placeholder by page.mjs. -->
  <!-- theme:init -->
  <!-- theme:css -->
  <style>
    /* Page layout only; colors, type and components come from the theme. */
    :root { --width-page: 52rem; } /* header and content share this width */
    h1.site-brand { margin: 0; }
    /* Fixed layout keeps the columns of every group's table aligned. */
    .table { table-layout: fixed; }
    .table th:nth-child(2) { width: 30%; }
    .table th:nth-child(3) { width: 10rem; } /* room for both buttons side by side, even on phones */
    .actions { display: flex; justify-content: flex-end; gap: var(--space-xs); }
    .group-head .actions { justify-content: flex-start; }
    .note { margin-top: var(--space-2xs); color: var(--color-muted); font-size: var(--text-s); }
    .muted { color: var(--color-muted); }
    .theme-switch { margin-left: auto; }
    section { margin-top: var(--space-l); }
    .group-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-s) var(--space-m); margin-bottom: var(--space-s); }
    .group-head h2 { margin: 0; font-size: var(--text-l); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-brand">Power switch</h1>
      <button type="button" role="switch" class="theme-switch" aria-checked="false" aria-label="Dark mode" data-theme-switch>
        <span class="theme-switch-text theme-switch-light" aria-hidden="true">Light</span>
        <span class="theme-switch-text theme-switch-dark" aria-hidden="true">Dark</span>
        <span class="theme-switch-thumb" aria-hidden="true"></span>
      </button>
    </div>
  </header>
  <main class="container">
    <div id="error" class="alert alert-danger" role="alert" hidden></div>
    <div id="groups"><p class="muted">Loading…</p></div>
  </main>

  <script>
    const REFRESH_MS = 5000;
    const SETTLED = ['running', 'stopped'];
    const LABELS = { ec2: 'EC2 instance', rds: 'RDS database' };
    const UNGROUPED = 'ungrouped';
    // Theme status class per state; any other state is still changing.
    const STATUS = { running: 'status-success', stopped: '' };
    const CHANGING = 'status-warning status-busy';
    let timer;
    // The banner shows the last action's failures and the last load's failure, if any.
    let actionError = '';
    let loadError = '';

    async function refresh() {
      clearTimeout(timer);
      try {
        const response = await fetch('/api/resources');
        if (!response.ok) throw new Error(`Loading failed (${response.status})`);
        const { resources } = await response.json();
        render(resources);
        showLoadError('');
        if (resources.some((r) => !SETTLED.includes(r.state))) timer = setTimeout(refresh, REFRESH_MS);
      } catch (error) {
        showLoadError(error.message);
      }
    }

    // Throws with the server's error message when the start/stop is not accepted.
    async function post(resource, action) {
      const path = `/api/resources/${resource.type}/${encodeURIComponent(resource.id)}/${action}`;
      const response = await fetch(path, { method: 'POST' });
      if (!response.ok) throw new Error((await response.json()).error || `${action} failed`);
    }

    async function change(resource, action) {
      try {
        await post(resource, action);
        showActionError('');
      } catch (error) {
        showActionError(error.message);
      }
      refresh();
    }

    // Starts every stopped resource in the group, or stops every running one, all at once.
    // A failure does not hold back the others; the banner names each one that failed.
    async function changeAll(resources, action) {
      const targets = resources.filter((r) => r.state === (action === 'start' ? 'stopped' : 'running'));
      const failures = await Promise.all(targets.map((r) => post(r, action).then(
        () => null,
        (error) => `${r.name}: ${action} failed: ${error.message}`,
      )));
      showActionError(failures.filter(Boolean).join('; '));
      refresh();
    }

    function render(resources) {
      const container = document.getElementById('groups');
      container.replaceChildren();
      if (!resources.length) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'No resources tagged for the power switch.';
        container.append(empty);
        return;
      }
      for (const [name, members] of groupByName(resources)) container.append(groupSection(name, members));
    }

    // [name, resources] pairs, named groups alphabetically, the empty group last as "ungrouped".
    function groupByName(resources) {
      const groups = new Map();
      for (const resource of resources) {
        const name = resource.group || '';
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(resource);
      }
      const names = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
      if (groups.has('')) names.push('');
      return names.map((name) => [name, groups.get(name)]);
    }

    function groupSection(name, resources) {
      const section = document.createElement('section');
      const head = document.createElement('div');
      head.className = 'group-head';
      const title = document.createElement('h2');
      title.textContent = name || UNGROUPED;
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.append(
        button('Start all', !resources.some((r) => r.state === 'stopped'), () => changeAll(resources, 'start')),
        button('Stop all', !resources.some((r) => r.state === 'running'), () => changeAll(resources, 'stop'), 'secondary'),
      );
      head.append(title, actions);
      section.append(head, resourceTable(resources));
      return section;
    }

    function resourceTable(resources) {
      const table = document.createElement('table');
      table.className = 'table';
      const headRow = row(['Resource', 'State', ''].map((text) => {
        const th = document.createElement('th');
        th.textContent = text;
        return th;
      }));
      table.createTHead().append(headRow);
      const body = table.createTBody();
      for (const resource of resources) {
        const name = cell(`${resource.name} (${LABELS[resource.type] || resource.type})`);
        const state = cell();
        state.className = 'state'; // hook for docs/demo/record-page.mjs
        state.append(status(resource.state));
        if (resource.type === 'rds' && resource.state === 'stopped') state.append(autoStartNote(resource));
        const actions = cell();
        const buttons = document.createElement('div');
        buttons.className = 'actions';
        buttons.append(
          button('Start', resource.state !== 'stopped', () => change(resource, 'start')),
          button('Stop', resource.state !== 'running', () => change(resource, 'stop'), 'secondary'),
        );
        actions.append(buttons);
        body.append(row([name, state, actions]));
      }
      return table;
    }

    function autoStartNote(resource) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = resource.autoStartAt
        ? `AWS will start this database again on ${new Date(resource.autoStartAt).toLocaleString()}.`
        : 'AWS will start this database again 7 days after it was stopped.';
      return note;
    }

    function row(cells) {
      const tr = document.createElement('tr');
      tr.append(...cells);
      return tr;
    }

    function cell(text = '') {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    function status(state) {
      const span = document.createElement('span');
      span.className = `status ${STATUS[state] ?? CHANGING}`.trim();
      span.textContent = state;
      return span;
    }

    // variant 'secondary' outlines the button, for the less common of two actions.
    function button(label, disabled, onClick, variant) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = variant === 'secondary' ? 'button button-secondary' : 'button';
      b.textContent = label;
      b.disabled = disabled;
      b.addEventListener('click', onClick);
      return b;
    }

    function showActionError(message) {
      actionError = message;
      showError();
    }

    function showLoadError(message) {
      loadError = message;
      showError();
    }

    function showError() {
      const el = document.getElementById('error');
      el.textContent = [actionError, loadError].filter(Boolean).join('; ');
      el.hidden = !el.textContent;
    }

    refresh();
  </script>
  <!-- theme:switch -->
</body>
</html>
